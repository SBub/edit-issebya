# Local monitoring for the worker, started by `yarn dev:studio`. One container
# holds Grafana (the UI), Tempo (traces), Loki (logs) and Prometheus (metrics) and takes
# OpenTelemetry over OTLP/HTTP. A second one (cAdvisor) measures the containers. The studio
# does not need either to run. Stop them with
# `docker compose -f docker-compose.monitoring.yml down`.
# One Compose project name for every checkout of the repo: a checkout in another folder would
# otherwise start a second stack and fight over ports 3300 and 4318. One stack per machine.
name: edit-issebya-monitoring
services:
  otel-lgtm:
    # A pinned release, never latest (checked on Docker Hub, `docker manifest inspect`).
    image: grafana/otel-lgtm:0.39.0
    ports:
      # Grafana at http://localhost:3300. Not 3000: the landing page (yarn dev) owns that port.
      - "127.0.0.1:3300:3000"
      # OTLP over HTTP: the worker posts traces to /v1/traces and logs to /v1/logs here.
      # 4317 (gRPC) is not published; the worker speaks HTTP.
      - "127.0.0.1:4318:4318"
    # The backends keep their data under /data (Loki, Tempo, Prometheus and Grafana each have a
    # folder there), so it survives a restart. `down -v` deletes it.
    volumes:
      - otel-lgtm-data:/data
      # The image's Prometheus config plus one scrape job: cAdvisor below.
      - ./monitoring/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro

  # Container metrics (CPU, throttling, memory, OOM kills, disk and network bytes) for every
  # container of the machine, the worker and the Supabase database among them. Prometheus in the
  # container above scrapes it over the Compose network; no host port is published.
  # On a Mac it measures Docker Desktop's Linux VM, never macOS (app_docs/measurement.md).
  cadvisor:
    # A pinned release, never latest (`docker manifest inspect`: it has a linux/arm64 image).
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command:
      # Containers only, no system cgroups.
      - --docker_only=true
      - --housekeeping_interval=10s
      # Only what the dashboard reads: cpu, memory, diskIO, network and oom_event stay on.
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,hugetlb,memory_numa,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp
      # No container label or env value becomes a metric label; the container name is enough.
      - --store_container_labels=false
    privileged: true
    devices:
      # Where the kernel reports OOM kills.
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      # The socket itself: Docker Desktop's VM has no socket under its own /var/run.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Docker keeps its images in containerd here (the containerd image store), and cAdvisor
      # asks containerd for each container's writable layer.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  otel-lgtm-data:
