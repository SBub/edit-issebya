# The worker in a container (Docker Desktop on the owner's Mac). Everything the worker
# runs is in the image: nothing on the Mac but Docker. `yarn dev:studio` builds it,
# runs the doctor in it and starts it with web, studio and monitoring, and stops them
# all (see app_docs/worker-container.md).
#
# compose.prod.yaml is the production override (its own env file, no source mounts).
name: edit-issebya-worker

services:
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: edit-issebya-worker:dev
    # PID 1 forwards signals: the worker's SIGTERM stop (finish the job, then exit).
    init: true
    stop_grace_period: 60s
    # Everything else, OPENROUTER_API_KEY among it, comes from the env file.
    env_file:
      - path: ./apps/worker/.env.development
        required: true
    environment:
      # The scratch folder inside the container, on the named volume below.
      WORKER_SCRATCH_DIR: /scratch
      # The container's ffmpeg (the env file's path is the Mac's).
      FFMPEG_PATH: /usr/bin/ffmpeg
      # Local services on the Mac (development only; compose.prod.yaml resets these).
      SUPABASE_URL: http://host.docker.internal:54431
      # Empty turns OTLP export off. `yarn dev:studio` sets WORKER_DOCKER_OTLP_ENDPOINT
      # to the local monitoring stack (docker-compose.monitoring.yml).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${WORKER_DOCKER_OTLP_ENDPOINT:-}
      # Empty on purpose: a PostHog token in the env file never goes to local Grafana.
      OTEL_EXPORTER_OTLP_HEADERS: ""
      OTEL_SERVICE_NAME: edit-issebya-worker-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - scratch:/scratch
      # Development: the worker's source from the working tree (rebuild not needed).
      - ./apps/worker/src:/repo/apps/worker/src:ro
      - ./packages/edit/src:/repo/packages/edit/src:ro
      - ./packages/storage/src:/repo/packages/storage/src:ro

volumes:
  # Jobs' temporary files: a Docker volume (fast on Docker Desktop), never a Mac folder.
  scratch:
