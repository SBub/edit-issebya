# Production override for the worker container: `docker compose -f compose.yaml
# -f compose.prod.yaml up`. It resets what development sets: the env file is
# .env.production, the environment keeps only what must differ inside the container
# (the scratch folder, ffmpeg), the scratch volume is its own, and
# no source is mounted. Same image; the MODNet model is in it.
services:
  worker:
    env_file: !override
      - path: ./apps/worker/.env.production
        required: true
    environment: !override
      WORKER_SCRATCH_DIR: /scratch
      FFMPEG_PATH: /usr/bin/ffmpeg
    volumes: !override
      - scratch-prod:/scratch

volumes:
  scratch-prod:
