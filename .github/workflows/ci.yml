name: ci

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      # Turbo's local task cache (turbo.json sets cacheDir); lint, typecheck,
      # test and build replay from it when nothing they read has changed.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: yarn install --immutable
        env:
          LEFTHOOK: 0
      - run: yarn format:check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn knip
      # The worker's step runner measures each tool through GNU time
      # (/usr/bin/time -v); its unit tests spawn real processes under it.
      - run: test -x /usr/bin/time || (sudo apt-get update && sudo apt-get install -y time)
      - run: yarn test
      # Built with no studio variables: proves both apps build without them.
      - run: yarn build
      # CI's own fresh local Supabase stack (never the hosted project): auth,
      # realtime, kong, postgrest and the database. `supabase start` applies
      # supabase/migrations/ to it.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.75.0
      - run: supabase start -x storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # Only what the tests need, by allow-list and under new names, so the
      # STUDIO_URL `supabase status` prints (Supabase's dashboard) never reaches
      # the environment, where the landing page would forward /studio to it.
      # NEXT_PUBLIC_SITE_URL stays unset: the confirmation link then follows
      # the forwarded host.
      - name: Export local Supabase values
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          echo "::add-mask::$SECRET_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
          } >> "$GITHUB_ENV"
      # Again, so the studio inlines the stack's public values (turbo rehashes
      # on NEXT_PUBLIC_*).
      - run: yarn build
      - run: yarn test:db
      # One install covers both suites: the studio pins the same
      # @playwright/test version, and browsers live in the shared cache.
      - run: yarn workspace @edit-issebya/web playwright install --with-deps chromium webkit
      - run: yarn test:e2e
