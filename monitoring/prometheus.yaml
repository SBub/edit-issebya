---
# The Prometheus config of the local monitoring container (docker-compose.monitoring.yml mounts it
# over /otel-lgtm/prometheus.yaml). Everything outside `scrape_configs` is the file shipped in
# grafana/otel-lgtm 0.39.0, unchanged: on an image upgrade, copy the new file and keep the
# `scrape_configs` block at the end.
global:
  scrape_native_histograms: true
otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment # backward compatibility
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database # used by otelcol/receiver/mongodb
    - kafka.cluster.alias
storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m
# Container CPU, memory, disk and network, read from cAdvisor (the `cadvisor` service of the same
# Compose project). 10 seconds, so a step that lasts under a minute still shows as a curve.
scrape_configs:
  - job_name: cadvisor
    scrape_interval: 10s
    static_configs:
      - targets: ["cadvisor:8080"]
    # A container has one real network interface (eth0); the kernel's idle tunnel devices
    # (gre0, sit0, ...) would add nine empty series to each network metric of each container.
    metric_relabel_configs:
      - source_labels: [interface]
        regex: erspan0|gre0|gretap0|ip6_vti0|ip6gre0|ip6tnl0|ip_vti0|sit0|tunl0
        action: drop
